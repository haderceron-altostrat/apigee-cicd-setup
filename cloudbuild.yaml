# Define substitution variables that can be overridden at trigger time
substitutions:
  _APIGEE_ORG: apigee-sandbox-non-vpc # Default value if none is provided
  _APIGEE_ENV: test                     # Default environment to deploy to

steps:
  # Step 1: Run Unit Tests (Optional but recommended)
  # This ensures code is clean before attempting deployment
  - name: 'gcr.io/cloud-builders/mvn'
    id: 'unit-tests'
    args: ['clean', 'test']

  # Step 2: Deploy to Apigee
  # Uses the Maven plugin to deploy the proxy
  - name: 'gcr.io/cloud-builders/mvn'
    id: 'deploy-apigee'
    args:
      - 'install'
      - '-P${_APIGEE_ENV}'           # Profile (usually maps to environment)
      - '-Dorg=${_APIGEE_ORG}'       # Pass the Organization variable
      - '-Denv=${_APIGEE_ENV}'       # Pass the Environment variable
      - '-Dapigee.config.options=update' # Update existing revisions
      - '-DskipTests'                # Skip tests here since we ran them in Step 1

# (Optional) Save logs to a specific bucket
# logsBucket: 'gs://my-build-logs'
