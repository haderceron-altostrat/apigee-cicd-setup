steps:
  # Step 1: Detect changes in Proxies folders
  - name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Cloud Build does a shallow clone by default. Fetch enough history.
        git fetch --depth=2 origin main || git fetch --depth=2

        # Detect changed files in Proxies/ directory
        # Filter for directories directly under Proxies/
        # Output unique proxy names to changed_proxies.txt
        
        echo "Detecting changes in Proxies/..."
        
        git diff HEAD~1 HEAD --name-only -- Proxies/ | grep "^Proxies/" | cut -d/ -f2 | sort | uniq > changed_proxies.txt
        
        if [ -s changed_proxies.txt ]; then
          echo "Changes detected in the following proxies:"
          cat changed_proxies.txt
        else
          echo "No changes detected in any proxy."
        fi

  # Step 2: Get an auth token (only if changes detected)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -s changed_proxies.txt ]; then
          gcloud auth print-access-token > token.txt
          echo "Auth token generated."
        else
          echo "Skipping token generation."
        fi

  # Step 3: Deploy Changed Proxies
  - name: 'ghcr.io/apigee/apigeecli:latest'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        if [ -s changed_proxies.txt ]; then
          TOKEN=$$(cat token.txt)
          
          # Loop through each changed proxy
          while IFS= read -r PROXY_NAME; do
            echo "------------------------------------------------"
            echo "Processing Proxy: $$PROXY_NAME"
            echo "------------------------------------------------"
            
            PROXY_DIR="Proxies/$$PROXY_NAME"
            
            # Find the first zip file in the directory
            ZIP_FILE=$$(find "$$PROXY_DIR" -maxdepth 1 -name "*.zip" | head -n 1)
            
            if [ -f "$$ZIP_FILE" ]; then
              echo "Found bundle: $$ZIP_FILE"
              
              echo "Creating/Updating Bundle for $$PROXY_NAME..."
              # Note: Using PROXY_NAME as the API Name in Apigee
              apigeecli apis create bundle -o "${_APIGEE_ORG}" -n "$$PROXY_NAME" -p "$$ZIP_FILE" -t "$$TOKEN" > /tmp/deploy-out.txt
              
              REVISION=$$(jq -r '.revision' /tmp/deploy-out.txt)
              echo "Bundle created with Revision: $$REVISION"
              
              echo "Deploying $$PROXY_NAME to ${_ENVIRONMENT}..."
              apigeecli apis deploy -o "${_APIGEE_ORG}" -n "$$PROXY_NAME" -e "${_ENVIRONMENT}" --ovr -v "$$REVISION" -t "$$TOKEN"
            else
              echo "Warning: No .zip file found in $$PROXY_DIR. Skipping."
            fi
            
          done < changed_proxies.txt
          
        else
          echo "No changes to deploy."
        fi

substitutions:
  _APIGEE_ORG: '[ADD_DEFAULT_VALUE]'
  _ENVIRONMENT: '[ADD_DEFAULT_VALUE]'

options:
  logging: CLOUD_LOGGING_ONLY
