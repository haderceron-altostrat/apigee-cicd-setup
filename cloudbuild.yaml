steps:
  # Step 1: Get an auth token for the Cloud Build service account
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud auth print-access-token > /workspace/token.txt
        echo "Auth token generated."
    volumes:
      - name: 'ws'
        path: /workspace

  # Step 2: List Apigee Environments using apigeecli
  - name: 'ghcr.io/apigee/apigeecli:latest'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Listing Apigee Environments..."
        APIGEE_TOKEN=$(cat /workspace/token.txt)
        apigeecli environments list -o "${_APIGEE_ORG}" -t "$APIGEE_TOKEN"
    volumes:
      - name: 'ws'
        path: /workspace

  # Step 3: List API Proxies using apigeecli
  - name: 'ghcr.io/apigee/apigeecli:latest'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Listing API Proxies..."
        APIGEE_TOKEN=$(cat /workspace/token.txt)
        apigeecli apis list -o "${_APIGEE_ORG}" -t "$APIGEE_TOKEN"
    volumes:
      - name: 'ws'
        path: /workspace

substitutions:
  _APIGEE_ORG: 'apigee-sandbox-non-vpc' # Default value, will be overridden by trigger

options:
  logging: CLOUD_LOGGING_ONLY
